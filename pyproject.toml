[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-init"
version = "0.1.0"
requires-python = ">=3.14"

[project.optional-dependencies]
test = [
    "chrysa-quality-gate @ git+ssh://git@github.com/chrysa/chrysa-lib.git@v0.3.0#subdirectory=packages/python/quality-gate",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
pythonpath = ["scripts"]

[tool.coverage.run]
source = ["scripts"]
omit = ["tests/*", "scripts/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff.lint]
select = [
    "C901",
    "PERF203",
    "PERF401",
    "PLR0402",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "PLR1714",
    "PLR1730",
    "PLR5501",
    "RUF005",
    "RUF006",
    "RUF007",
    "RUF009",
    "RUF012",
    "RUF013",
    "RUF022",
    "RUF043",
    "RUF059",
    "RUF100",
]
